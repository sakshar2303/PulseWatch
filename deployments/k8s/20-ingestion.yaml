apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: pulsewatch
  labels:
    app.kubernetes.io/name: ingestion
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: ingestion
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: pulsewatch
  labels:
    app.kubernetes.io/name: ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
    spec:
      containers:
        - name: ingestion
          image: pulsewatch/ingestion:latest
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsewatch-secrets
                  key: DATABASE_URL
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsewatch-config
                  key: NATS_URL
            - name: PORT
              value: "8081"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: pulsewatch-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-hpa
  namespace: pulsewatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
