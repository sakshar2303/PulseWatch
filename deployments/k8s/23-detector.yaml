apiVersion: v1
kind: Service
metadata:
  name: detector
  namespace: pulsewatch
  labels:
    app.kubernetes.io/name: detector
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: detector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  namespace: pulsewatch
  labels:
    app.kubernetes.io/name: detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detector
    spec:
      containers:
        - name: detector
          image: pulsewatch/detector:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DETECTOR_DB_URL
              valueFrom:
                secretKeyRef:
                  name: pulsewatch-secrets
                  key: DATABASE_URL
            - name: DETECTOR_PORT
              value: "8000"
            - name: DETECTOR_HOST
              value: "0.0.0.0"
            - name: EVAL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: pulsewatch-config
                  key: EVAL_INTERVAL_SECONDS
            - name: LOOKBACK_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: pulsewatch-config
                  key: LOOKBACK_MINUTES
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
