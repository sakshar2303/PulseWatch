# ==============================================================================
# PulseWatch — CI Pipeline
# ==============================================================================
# Runs on every push and PR: lint, test, and build all services.
# Deploy workflow is separate (deploy.yml) and runs only on main branch.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================================
  # Go Services (collector, ingestion, api)
  # ============================================================================
  go:
    name: Go — Lint, Test, Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [collector, ingestion, api]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.service }}

      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out
        working-directory: ${{ matrix.service }}

      - name: Build
        run: go build -o /dev/null ./cmd/${{ matrix.service }}/
        working-directory: ${{ matrix.service }}

  # ============================================================================
  # Python (anomaly detector)
  # ============================================================================
  python:
    name: Python — Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
        working-directory: detector

      - name: Lint
        run: ruff check app/ tests/
        working-directory: detector

      - name: Test
        run: python -m pytest tests/ -v
        working-directory: detector

  # ============================================================================
  # Frontend (dashboard)
  # ============================================================================
  frontend:
    name: Frontend — Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint
        run: npm run lint
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

  # ============================================================================
  # Docker Container Build Validation
  # ============================================================================
  docker:
    name: Docker — Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [go, python, frontend]
    strategy:
      matrix:
        include:
          - service: collector
            dockerfile: collector/Dockerfile
          - service: ingestion
            dockerfile: ingestion/Dockerfile
          - service: api
            dockerfile: api/Dockerfile
          - service: detector
            dockerfile: detector/Dockerfile
          - service: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: pulsewatch/${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
